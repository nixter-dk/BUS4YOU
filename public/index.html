<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BusOps · Alba Turist</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<div id="toast"></div>
<main id="login" class="login-shell"><section class="login-card"><div class="brand"><span>AT</span><div><strong>Alba Turist</strong><small>BusOps</small></div></div><h1>Velkommen tilbage</h1><p>Log ind for at administrere dagens ture.</p><form id="loginForm"><label>E-mail<input name="email" type="email" value="admin@albaturist.dk" required></label><label>Adgangskode<input name="password" type="password" value="admin123" required></label><button>Log ind</button></form><details><summary>Demo-login</summary><small>Admin: admin@albaturist.dk / admin123<br>Chauffør: mads@albaturist.dk / chauffor123</small></details></section><aside class="login-art"><div><p>Booking og check-in</p><h2>Hele turen.<br>Ét samlet overblik.</h2><span>Passagerer · Sæder · Bagage</span></div></aside></main>
<div id="app" hidden><aside class="sidebar"><div class="brand light"><span>AT</span><div><strong>Alba Turist</strong><small>BusOps</small></div></div><nav><button class="nav active" data-view="dashboard">▦ <span>Overblik</span></button><button class="nav" data-view="calendar">□ <span>Turkalender</span></button><button class="nav admin-only" data-view="stops">⌖ <span>Opsamlingssteder</span></button></nav><div class="sidebar-bottom"><div class="avatar" id="avatar"></div><div><strong id="userName"></strong><small id="userRole"></small></div><button id="logout" title="Log ud">↗</button></div></aside>
<section class="content"><header><div><small id="eyebrow">BUSOPS</small><h1 id="pageTitle">Overblik</h1></div><button class="primary admin-only" id="newTrip">+ Ny tur</button></header><div id="view"></div></section></div>
<dialog id="modal"><form method="dialog"><button class="close" value="cancel">×</button></form><div id="modalBody"></div></dialog>
<template id="tripForm"><h2>Opret ny tur</h2><p class="muted">Planlæg afgang og tilknyt chaufførerne.</p><form class="form" id="createTrip"><label class="wide">Turens navn<input name="title" placeholder="København → Aarhus" required></label><label>Afgang<input name="departureAt" type="datetime-local" required></label><label>Grundpris (kr.)<input name="basePrice" type="number" min="0" value="350" required></label><label>Fra<select name="originId" required></select></label><label>Til<select name="destinationId" required></select></label><label>Primær chauffør<select name="primaryDriverId" required></select></label><label>Sekundær chauffør<select name="secondaryDriverId"><option value="">Ingen</option></select></label><button class="primary wide">Opret tur</button></form></template>
<script src="/app.js"></script></body></html>
