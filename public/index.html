<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BusOps · Alba Turist</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/styles.css?v=20260815-stops-live"><link rel="stylesheet" href="/passenger-bootstrap.css?v=20260815-stops-live"></head>
<body>
<div id="toast"></div>
<main id="login" class="login-shell"><section class="login-card"><div class="brand"><img class="brand-logo" alt="Virksomhedslogo" hidden><span>AT</span><div><strong>Alba Turist</strong><small>BusOps</small></div></div><h1>Velkommen tilbage</h1><p>Log ind for at administrere dagens ture.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Adgangskode<input name="password" type="password" autocomplete="current-password" required></label><label class="remember-login"><input name="rememberMe" type="checkbox" value="true"><span><strong>Husk mig på denne enhed</strong><small>Du forbliver logget ind i op til 30 dage</small></span></label><button>Log ind</button></form></section><aside class="login-art"><div><div class="login-official-logo"><img src="/assets/alba-turist-logo.jpg" alt="Alba Turist"></div><p>Booking og check-in</p><h2>Hele turen.<br>Ét samlet overblik.</h2><span>Passagerer · Sæder · Bagage</span></div></aside></main>
<div id="app" hidden><aside class="sidebar"><div class="brand light"><img class="brand-logo" alt="Virksomhedslogo" hidden><span>AT</span><div><strong>Alba Turist</strong><small>BusOps</small></div></div><nav><button class="nav active" data-view="dashboard"><span>Overblik</span></button><button class="nav" data-view="calendar"><span>Turkalender</span></button><button class="nav admin-only" data-view="stops"><span>Opsamlingssteder</span></button></nav><div class="sidebar-bottom"><div class="avatar" id="avatar"></div><div><strong id="userName"></strong><small id="userRole"></small></div><button id="logout" title="Log ud" aria-label="Log ud"></button></div></aside>
<section class="content"><header><div><small id="eyebrow">BUSOPS</small><h1 id="pageTitle">Overblik</h1></div><button class="primary" id="newTrip">+ Ny tur</button></header><div id="view"></div></section></div>
<dialog id="modal"><form method="dialog"><button class="close" value="cancel" aria-label="Luk"></button></form><div id="modalBody"></div></dialog>
<template id="tripForm"><h2>Opret ny tur</h2><p class="muted">Planlæg afgang, forventet ankomst og tilknyt chaufførerne.</p><form class="form" id="createTrip"><label class="wide">Turens navn<input name="title" placeholder="København → Tetovo" required></label><label>Afgang fra startsted<input name="departureAt" type="datetime-local" required><small>København-tid · startstedet har kun afgang</small></label><label>Forventet ankomst ved slutsted<input name="destinationArrivalAt" type="datetime-local" required><small>København-tid · slutstedet har kun ankomst</small></label><label>Fra<select name="originId" required></select></label><label>Til<select name="destinationId" required></select></label><label>Primær chauffør<select name="primaryDriverId" required></select></label><label>Sekundær chauffør<select name="secondaryDriverId"><option value="">Ingen</option></select></label><button class="primary wide">Opret tur</button></form></template>
<script src="/translations.js"></script><script src="/app.js?v=20260815-sales-trip"></script><script src="/passenger-bootstrap.js?v=20260815-sales-trip"></script><script src="/bootstrap-icons-app.js?v=20260815-sales-trip"></script></body></html>
