services:
  - type: web
    name: busops-albaturist
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: busops-db
          property: connectionString
      - key: INITIAL_ADMIN_NAME
        value: Administrator
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: 8
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: busops-files
      mountPath: /data
      sizeGB: 1

databases:
  - name: busops-db
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
