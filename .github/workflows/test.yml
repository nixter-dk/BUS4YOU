name: BusOps test

on:
  push:
    branches: [main, agent/publish-busops-updates]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6
      - name: Brug Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installer afhængigheder
        run: npm ci --no-audit --no-fund
      - name: Kontrollér og test
        run: npm run check
